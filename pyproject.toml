[project]
name = 'drop-cpg'
description = 'CPG additions to nf-core/drop: Metamist sample sheet and seqr export scripts'
requires-python = '>=3.11'
version = '0.1.0'
# bin/build_drop_samplesheet.py; bin/export_seqr_rna.py needs only the standard library
dependencies = ['metamist>=7.13.0']

[dependency-groups]
dev = ['pytest', 'ruff']

[tool.uv]
# not an installable package: Nextflow puts bin/ on PATH
package = false

[tool.pytest.ini_options]
testpaths = ['tests/python']
pythonpath = ['bin', 'tests/python']

[tool.ruff]
line-length = 120
# only the CPG scripts; upstream nf-core files are left as they are
include = ['bin/build_drop_samplesheet.py', 'bin/export_seqr_rna.py', 'tests/python/**/*.py']

[tool.ruff.format]
indent-style = 'space'
quote-style = 'single'

[tool.ruff.lint]
select = ['A', 'B', 'C', 'E', 'F', 'G', 'I', 'N', 'Q', 'S', 'W', 'ARG', 'BLE', 'ERA', 'PIE', 'PL', 'RET', 'RUF', 'SIM', 'UP']
ignore = ['G004'] # f-strings in log calls

[tool.ruff.lint.per-file-ignores]
'tests/python/*' = ['S101', 'PLR2004']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'